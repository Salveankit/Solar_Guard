[project]
name = "solarguard"
version = "0.1.0"
description = "SolarGuard rooftop-solar O&M decision intelligence POC"
readme = "PROJECT_CONTEXT.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.9",
    "alembic>=1.18.5",
    "pvlib>=0.15.2",
    "scikit-learn>=1.9.0",
    "xgboost>=3.2.0",
    "joblib>=1.5.3",
    "ortools>=9.12.0",
    "streamlit>=1.41.0",
    "plotly>=5.24.0",
    "folium>=0.17.0",
    "streamlit-folium>=0.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
